name: FGA Relay
version: "2026.09.29.4"
slug: fga_relay
image: ghcr.io/drmogie/{arch}-addon-fga-relay
description: Our own REST API relay between Foundry VTT and tools like Claude. Easy setup, one login.
url: https://github.com/drmogie/foundry-mcp
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ports:
  3011/tcp: 3011
ports_description:
  3011/tcp: Relay web page, API, and the link for the Foundry module
options:
  log_level: info
  admin_username: ""
  admin_password: ""
  write_worlds: mcp-test
schema:
  log_level: list(debug|info|warning|error)
  admin_username: str?
  admin_password: password?
  write_worlds: str?
