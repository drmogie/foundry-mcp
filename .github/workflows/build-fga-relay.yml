name: Build FGA relay image

on:
  push:
    branches: [main]
    paths:
      - "relay-py/**"
      - ".github/workflows/build-fga-relay.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' relay-py/config.yaml | sed 's/version: *//; s/"//g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: relay-py
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/drmogie/${{ matrix.arch }}-addon-fga-relay:${{ steps.ver.outputs.version }}
            ghcr.io/drmogie/${{ matrix.arch }}-addon-fga-relay:latest
          labels: |
            org.opencontainers.image.source=https://github.com/drmogie/foundry-mcp
            io.hass.version=${{ steps.ver.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
