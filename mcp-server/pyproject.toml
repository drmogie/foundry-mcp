[project]
name = "foundry-mcp"
version = "2026.9.29.8"
description = "MCP server that lets Claude read a Foundry VTT world through the Foundry VTT MCP & Rest Relay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
foundry-mcp = "foundry_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["foundry_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
